<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Turquoise/pink are the site's dark-theme accent pair; the darker
       shades used for the sticks and d-pad are the light-theme variants of
       the same colors, reused here as the detail tone.
       The controller is drawn after the battery so it sits in front, with
       the battery running the full height behind it: visible above, and
       emerging again below the grips. The controller's top edge lands in a
       gap between segments so no segment is cut mid-way. -->

  <!-- Battery: outlined body with level segments inside -->
  <rect x="228" y="20" width="56" height="26" rx="8" fill="#f06aa5"/>
  <rect x="148" y="44" width="216" height="428" rx="32"
        fill="none" stroke="#f06aa5" stroke-width="16"/>
  <rect x="174" y="70" width="164" height="79" rx="12" fill="#f06aa5"/>
  <rect x="174" y="169" width="164" height="79" rx="12" fill="#f06aa5"/>
  <rect x="174" y="268" width="164" height="79" rx="12" fill="#f06aa5"/>
  <rect x="174" y="367" width="164" height="79" rx="12" fill="#f06aa5"/>

  <!-- Controller -->
  <circle cx="136" cy="362" r="76" fill="#3dd6cf"/>
  <circle cx="376" cy="362" r="76" fill="#3dd6cf"/>
  <rect x="58" y="248" width="396" height="150" rx="75" fill="#3dd6cf"/>

  <!-- D-pad -->
  <rect x="154" y="272" width="24" height="48" rx="5" fill="#0e918c"/>
  <rect x="142" y="284" width="48" height="24" rx="5" fill="#0e918c"/>

  <!-- Face buttons -->
  <circle cx="350" cy="268" r="12" fill="#0e918c"/>
  <circle cx="378" cy="296" r="12" fill="#0e918c"/>
  <circle cx="350" cy="324" r="12" fill="#0e918c"/>
  <circle cx="322" cy="296" r="12" fill="#0e918c"/>

  <!-- Joysticks -->
  <circle cx="214" cy="356" r="30" fill="#0e918c"/>
  <circle cx="214" cy="356" r="12" fill="#3dd6cf"/>
  <circle cx="298" cy="356" r="30" fill="#0e918c"/>
  <circle cx="298" cy="356" r="12" fill="#3dd6cf"/>

  <!-- Notification badge -->
  <circle cx="446" cy="80" r="50" fill="#ffcc33"/>
  <rect x="436" y="44" width="20" height="42" rx="10" fill="#1a1d21"/>
  <circle cx="446" cy="106" r="10" fill="#1a1d21"/>
</svg>
