on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag to create and release (e.g. v1.18.0-test)'
        required: true
        type: string

name: release

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          release-type: rust
          manifest-file: Cargo.toml
          config-file: .release-please-config.json
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  upload-assets:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write  # required by Cosign OIDC signing only
    steps:
      - uses: actions/checkout@v4

      - name: Create and push tag
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ inputs.tag_name }}"
          git push origin "${{ inputs.tag_name }}"

      - name: Resolve tag name
        id: tag
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag_name=${{ inputs.tag_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag_name=${{ needs.release-please.outputs.tag_name }}" >> "$GITHUB_OUTPUT"
          fi

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.4.1  # pin — update when upgrading

      - name: Sign binary with Sigstore
        shell: pwsh
        run: |
          cosign sign-blob `
            target/release/ps-battery.exe `
            --yes `
            --bundle target/release/ps-battery.exe.bundle

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' }}
          files: |
            target/release/ps-battery.exe
            target/release/ps-battery.exe.bundle
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Builds the MSIX used for Microsoft Store submission. It is signed with a
  # throwaway self-signed certificate purely so the package is well-formed —
  # the Store re-signs on ingestion. That cert is NOT trusted on end-user
  # machines, so this package is uploaded as a workflow artifact for manual
  # Partner Center submission, never as a public release asset.
  build-msix:
    needs: release-please
    if: ${{ always() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: microsoft/setup-WinAppCli@v0.1  # pin — update when upgrading

      - name: Build release binary
        run: cargo build --release

      - name: Stage package layout
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/ps-battery.exe dist/

      # MSIX requires a 4-part version; Cargo's is 3-part semver. Patched via
      # the XML DOM rather than a regex, so it can't also hit the xml
      # declaration or MinVersion/MaxVersionTested.
      - name: Set manifest version from Cargo.toml
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          [xml]$doc = Get-Content Package.appxmanifest
          $doc.Package.Identity.Version = "$version.0"
          $doc.Save((Resolve-Path Package.appxmanifest))
          Write-Output "MSIX version: $version.0"

      - name: Pack MSIX
        run: winapp pack ./dist --manifest Package.appxmanifest --generate-cert

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: msix-package
          path: '*.msix'
          if-no-files-found: error
